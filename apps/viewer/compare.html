<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DDGI and native, side by side</title>
        <link rel="icon" href="data:," />
        <style>
            :root {
                --ink: #dfe6ee;
                --muted: #93a1b1;
                --accent: #5db0ff;
                --ours: #5db0ff;
                --native: #ff9d3c;
            }
            html,
            body {
                margin: 0;
                min-height: 100%;
                background: #0b0d10;
                color: var(--ink);
                font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
            }
            main {
                max-width: 1700px;
                margin: 0 auto;
                padding: 12px 16px 0;
            }
            h1 {
                margin: 0 0 4px;
                font-size: 18px;
            }
            .note {
                margin: 4px 0 10px;
                color: var(--muted);
            }
            .bar {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px 16px;
                margin: 8px 0;
            }
            .bar label {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                color: var(--muted);
            }
            select,
            button {
                padding: 5px 8px;
                color: var(--ink);
                background: #1b222b;
                border: 1px solid #36404d;
                border-radius: 4px;
                font: inherit;
            }
            button {
                cursor: pointer;
                min-width: 80px;
            }
            button:hover,
            select:hover {
                border-color: var(--accent);
            }
            .sides {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .side h2 {
                margin: 0 0 4px;
                font-size: 14px;
            }
            .side.ours h2 {
                color: var(--ours);
            }
            .side.native h2 {
                color: var(--native);
            }
            .side .frame {
                position: relative;
                aspect-ratio: 16 / 9;
                background: #000;
                border: 1px solid #2a323d;
            }
            .side img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            .side .caption {
                margin: 4px 0 0;
                color: var(--muted);
                font-size: 12px;
            }
            .side .readout {
                font-variant-numeric: tabular-nums;
            }
            #scrub {
                flex: 1;
                min-width: 300px;
            }
            #time {
                font-variant-numeric: tabular-nums;
                min-width: 220px;
            }
            #plot {
                display: block;
                width: 100%;
                height: 240px;
                margin-top: 6px;
                background: #0d1117;
                border: 1px solid #2a323d;
                cursor: crosshair;
            }
            .legend {
                display: flex;
                gap: 18px;
                margin: 4px 0;
                color: var(--muted);
            }
            .legend .swatch {
                display: inline-block;
                width: 18px;
                height: 3px;
                margin-right: 6px;
                vertical-align: middle;
            }
            #help {
                position: sticky;
                bottom: 0;
                margin: 12px -16px 0;
                padding: 10px 16px 12px;
                min-height: 40px;
                background: #121820;
                border-top: 1px solid #2f3a48;
                color: #c9d6e4;
            }
            #status {
                color: var(--muted);
            }
            #status.problem {
                color: #ff8c8c;
            }
        </style>
    </head>
    <body>
        <main id="app"></main>
        <script type="module" src="/src/compare/compare-page.ts"></script>
    </body>
</html>
